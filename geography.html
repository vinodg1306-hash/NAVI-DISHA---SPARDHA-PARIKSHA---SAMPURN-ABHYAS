      <h3>१. सोप्या भाषेत संकल्पना व व्याख्या</h3>
      <p><b>'भूगोल'</b> या शब्दाची फोड <b>भू (पृथ्वी) + गोल (गोलाकार स्वरूप)</b> अशी आहे. इंग्रजीत याला <b>'Geography'</b> म्हणतात. हा शब्द ग्रीक भाषेतील 'Geo' (पृथ्वी) आणि 'Grapho' (वर्णन करणे) या दोन शब्दांपासून तयार झाला आहे.</p>
      <div class="box">
        <b>शास्त्रीय व्याख्या:</b> पृथ्वीचा पृष्ठभाग, त्यावर आढळणारे प्राकृतिक घटक (पर्वत, नद्या, हवामान) आणि मानवाचा त्याच्या सभोवतालच्या पर्यावरणाशी असलेला परस्परसंबंध यांचा वैज्ञानिक अभ्यास म्हणजे <b>भूगोल</b> होय.

      <h3>२. भूगोलाच्या दोन प्रमुख शाखा</h3>
      <p><b>अ) प्राकृतिक भूगोल (Physical Geography):</b> निसर्गाने निर्माण केलेल्या घटकांचा अभ्यास. उदा. पर्वत, पठारे, मैदाने, नद्या, खडक, वारे, पाऊस, तापमान आणि महासागर.</p>
      <p><b>ब) मानवी भूगोल (Human Geography):</b> मानवाने निसर्गाचा वापर करून केलेल्या बदलांचा अभ्यास. उदा. शेती, उद्योग, गावे, शहरे, वाहतूक व्यवस्था, व्यापार आणि लोकसंख्या.</p>

let currentCat = 'all';

function renderList(filteredTopics) {
  const container = document.getElementById('topicList');
  container.innerHTML = '';
  filteredTopics.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'topic';
    btn.id = 'top-' + t.id;
    btn.innerText = t.id + '. ' + t.title;
    btn.onclick = () => loadLesson(t.id);
    container.appendChild(btn);
  });
}

function filterCat(cat, elem) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  if (elem) elem.classList.add('active');
  const filtered = cat === 'all' ? syllabus : syllabus.filter(t => t.cat === cat);
  renderList(filtered);
}

function searchTopics() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = syllabus.filter(t => {
    const matchesCat = (currentCat === 'all' || t.cat === currentCat);
    return matchesCat && (t.title.toLowerCase().includes(q) || (t.id + '').includes(q));
  });
  renderList(filtered);
}

function loadLesson(id) {
  document.querySelectorAll('.topic').forEach(b => b.classList.remove('active'));
  const activeBtn = document.getElementById('top-' + id);
  if (activeBtn) activeBtn.classList.add('active');

  const container = document.getElementById('lessonContainer');
  const data = lessonsContent[id];

  if (!data) {
    const topicInfo = syllabus.find(t => t.id === id);
    container.innerHTML = `
      <h1>${topicInfo.id}. ${topicInfo.title}</h1>
      <div class="box">
        <b>विभाग:</b> ${topicInfo.cat} भूगोल<br>
        या घटकाचा संपूर्ण सविस्तर अभ्यासक्रम, संकल्पना, सराव तक्ते आणि परीक्षाभिमुख प्रश्न लवकरच अपडेट होत आहेत.
      </div>
      <h2>अभ्यास रूपरेषा</h2>
      <ul>
        <li>मूलभूत संकल्पना व व्याख्या</li>
        <li>परीक्षेच्या दृष्टीने आवश्यक घटक व वर्गीकरण</li>
        <li>महाराष्ट्राच्या व भारताच्या संदर्भातील तथ्ये</li>
        <li>१० ते २० वस्तुनिष्ठ सराव बहुपर्यायी प्रश्न (MCQ)</li>
      </ul>
    `;
    return;
  }

  let mcqHTML = '<h2>📝 सराव प्रश्नसंच (MCQ)</h2>';
  data.mcqs.forEach((m, idx) => {
    mcqHTML += `
      <div class="mcq-card">
        <b>प्र. ${idx + 1}) ${m.q}</b>
        ${m.options.map((opt, oIdx) => `
          <button class="opt-btn" onclick="checkAnswer(this, ${oIdx === m.ans}, ${idx}, '${encodeURIComponent(m.exp)}')">
            ${String.fromCharCode(65 + oIdx)}. ${opt}
          </button>
        `).join('')}
        <div class="exp" id="exp-${idx}"></div>
      </div>
    `;
  });

  container.innerHTML = `
    <h1>${data.title}</h1>
    ${data.content}
    ${mcqHTML}
  `;
}

function checkAnswer(btn, isCorrect, qIdx, expEncoded) {
  const parent = btn.parentElement;
  parent.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  const expBox = document.getElementById('exp-' + qIdx);
  expBox.style.display = 'block';
  expBox.innerHTML = '<b>स्पष्टीकरण:</b> ' + decodeURIComponent(expEncoded);

  if (isCorrect) {
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
  }
}

function speakCurrent() {
  const text = document.getElementById('lessonContainer').innerText;
  if (!('speechSynthesis' in window)) {
    alert('आपल्या ब्राउझरमध्ये ऑडिओ सुविधा उपलब्ध नाही.');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'mr-IN';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

// Initial Load
filterCat('all');
loadLesson(1);
