*{box-sizing:border-box;word-wrap:break-word;margin:0;padding:0}
body{font-family:system-ui,'Noto Sans Devanagari',sans-serif;background:#f0f2ff;color:#1a1a1a;line-height:1.5}
.hero{background:linear-gradient(135deg,#0d1b6e 0%,#1e2a8a 50%,#3949ab 100%);color:#fff;padding:20px 14px 28px;text-align:center;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;bottom:-30px;left:0;right:0;height:60px;background:#f0f2ff;border-radius:50% 50% 0 0}

.hero p{font-size:13px;opacity:.9;margin-top:6px;position:relative;z-index:1}
.hero .stats{display:flex;justify-content:center;gap:14px;margin-top:14px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.15);backdrop-filter:blur(6px);padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.2)}
.searchbar{margin:-18px 14px 0;background:#fff;border-radius:16px;padding:10px;display:flex;gap:8px;box-shadow:0 8px 24px rgba(13,27,110,.15);position:relative;z-index:5}
.searchbar input{flex:1;border:1.5px solid #c5cae9;border-radius:12px;padding:11px 14px;font-size:14px;outline:none}
.searchbar input:focus{border-color:#ff6f00}
.btn{padding:11px 18px;background:linear-gradient(135deg,#ff6f00,#ff8f00);color:#fff;border:none;border-radius:12px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(255,111,0,.3)}
.tabs{display:flex;flex-wrap:wrap;gap:9px;padding:14px;background:transparent}
.tab{flex:1 1 28%;background:#fff;border:2px solid #e8eaf6;border-radius:16px;padding:12px 6px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.2s;min-width:88px}
.tab b{display:block;font-size:22px}.tab span{font-size:11.5px;font-weight:700;color:#1a237e;display:block;margin-top:2px}
.tab.active{background:linear-gradient(135deg,#ff6f00,#ff8f00);border-color:#ff6f00;transform:translateY(-2px);box-shadow:0 6px 16px rgba(255,111,0,.35)}
.tab.active span{color:#fff}
.section{display:none;padding:0 12px 20px}.section.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card{background:#fff;border-radius:18px;margin:14px 0;padding:14px;box-shadow:0 6px 18px rgba(13,27,110,.08);border:1px solid #e8eaf6;overflow:hidden}
.card h2{background:linear-gradient(90deg,#0d1b6e,#3949ab);color:#fff;padding:10px 14px;border-radius:10px;margin:-4px -4px 10px;font-size:15px}
