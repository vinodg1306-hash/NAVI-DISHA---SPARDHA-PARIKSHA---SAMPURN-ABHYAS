<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">

<meta name="description" content="नवी दिशा — English Complete Course 2026 | मराठी माध्यम विद्यार्थ्यांसाठी इंग्रजी अभ्यासक्रम">
<title>English Complete Course 2026 | नवी दिशा</title>
<style>
:root{--nav:#173b72;--nav2:#2459a6;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#60708a;--accent:#f2a900;--ok:#138a5b;--bad:#c0392b;--line:#dfe6f0;--shadow:0 8px 24px rgba(24,55,95,.10)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Devanagari",Arial,sans-serif;line-height:1.65}.top{background:linear-gradient(135deg,var(--nav),var(--nav2));color:#fff;padding:28px 18px 24px}.wrap{max-width:1100px;margin:auto}.brand{font-size:28px;font-weight:800}.tag{opacity:.92}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer;background:#fff;color:var(--nav)}.btn.gold{background:var(--accent);color:#172033}.btn.dark{background:#0e2b55;color:#fff}.grid{display:grid;grid-template-columns:280px 1fr;gap:20px;padding:20px 0}.panel,.lesson{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.panel{padding:14px;height:max-content;position:sticky;top:12px}.panel h3{margin:5px 8px 10px}.search{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}.topics{max-height:70vh;overflow:auto}.topic{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 9px;border-radius:9px;cursor:pointer;color:var(--text);font-weight:600}.topic:hover,.topic.active{background:#eaf1fc;color:var(--nav)}.lesson{padding:25px}.lesson h1{margin-top:0;color:var(--nav);font-size:30px}.lesson h2{color:var(--nav);border-bottom:2px solid #e8eef7;padding-bottom:5px}.lesson h3{color:#2459a6}.box{background:#f7faff;border-left:5px solid var(--nav2);padding:14px 16px;border-radius:8px;margin:13px 0}.formula{font-family:ui-monospace,Consolas,monospace;background:#172033;color:#fff;padding:13px;border-radius:9px;overflow:auto}.example{border:1px solid var(--line);border-radius:10px;padding:12px;margin:9px 0}.en{font-weight:800}.mr{color:#50617b}.mistake{border-left:5px solid var(--bad);background:#fff4f2;padding:12px}.exam{border-left:5px solid var(--accent);background:#fff9e8;padding:12px}.mcq{border:1px solid var(--line);padding:13px;border-radius:10px;margin:10px 0}.mcq button{display:block;width:100%;text-align:left;margin:6px 0;padding:9px;border:1px solid #ccd6e4;background:#fff;border-radius:8px;cursor:pointer}.mcq button.correct{background:#e9f8f1;border-color:#72c8a5}.mcq button.wrong{background:#fff0ee;border-color:#e49a91}.progress{height:9px;background:#e5ebf3;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:var(--ok);width:0}.ai{margin-top:18px;background:linear-gradient(135deg,#f0f5ff,#fff);border:1px solid #cad9f0;padding:16px;border-radius:14px}.ai textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:10px}.aiout{white-space:pre-wrap;margin-top:10px}.foot{text-align:center;color:var(--muted);padding:25px}.small{font-size:13px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.panel{position:static}.topics{max-height:260px}.lesson{padding:18px}.lesson h1{font-size:25px}}@media print{.top,.panel,.bar,.ai,.no-print{display:none!important}.grid{display:block}.lesson{box-shadow:none;border:0}.lesson h1{font-size:24px}}
</style></head>
<body>
<header class="top"><div class="wrap"><div class="brand">📘 नवी दिशा — English Complete Course 2026</div><div class="tag">शिका • ऐका • सराव करा • स्वतःची चाचणी घ्या • पुढे चला</div><div class="bar"><button class="btn gold" onclick="speakCurrent()">🔊 धडा ऐका</button><button class="btn" onclick="window.print()">🖨️ Print / Save PDF</button><button class="btn dark" onclick="location.href='index.html'">⌂ मुख्य पृष्ठ</button></div></div></header>
<main class="wrap grid">
<aside class="panel"><h3>40 English Topics</h3><input id="search" class="search" placeholder="Topic शोधा..." oninput="filterTopics()"><div class="small">Progress: <span id="pct">0%</span></div><div class="progress"><div id="prog"></div></div><div id="topics" class="topics"></div></aside>
<section class="lesson" id="lesson"></section>
</main>
<footer class="foot">नवी दिशा — प्रगतीची वाटचाल | © 2026</footer>
<script>
const topics=[
['The Sentence','वाक्य'],['Subject and Predicate','उद्देश्य आणि विधेय'],['Parts of Speech','शब्दांच्या जाती'],['Nouns: Singular and Plural I','एकवचन आणि अनेकवचन I'],['Nouns: Singular and Plural II','एकवचन आणि अनेकवचन II'],['Kinds of Nouns','नामांचे प्रकार'],['Gender','लिंग'],['Cases','विभक्ती'],['Pronouns','सर्वनामे'],['Adjectives','विशेषणे'],['Verbs','क्रियापदे'],['Mood','क्रियापदाचा भाव'],['Tenses','काळ — 12 प्रकार'],['Auxiliary Verbs','सहाय्यकारी क्रियापदे'],['Verb Forms','क्रियापदांची रूपे'],['Verbals','Infinitive, Participle, Gerund'],['Negative Sentences','नकारार्थी वाक्ये'],['Articles','a, an, the'],['Adverbs','क्रियाविशेषणे'],['Prepositions','शब्दयोगी अव्यये'],['Conjunctions','उभयान्वयी अव्यये'],['Interjections','केवलप्रयोगी अव्यये'],['Phrase and Clause','Phrase आणि Clause'],['Clauses','उपवाक्ये'],['Simple Compound Complex','वाक्यांचे प्रकार'],['Analysis of Simple Sentences','सोप्या वाक्याचे विश्लेषण'],['Analysis of Complex and Compound','संयुक्त व मिश्र वाक्यांचे विश्लेषण'],['Transformation of Sentences','वाक्यरूपांतरण'],['Synthesis of Sentences','वाक्यसंश्लेषण'],['Capital Letters','Capital Letters चा वापर'],['Punctuation','विरामचिन्हे'],['Noun Adjective Adverb Forms','शब्दरूपे'],['Direct and Indirect Speech','प्रत्यक्ष व अप्रत्यक्ष कथन'],['Figures of Speech','अलंकार'],['Essay Writing','निबंधलेखन'],['Story Writing','कथालेखन'],['Letter Writing','पत्रलेखन'],['Comprehension','उतारा आकलन'],['Precis Writing','सारांश लेखन'],['Translation','भाषांतर सराव']];
const tenseData=[
['Present Simple','Subject + V1(s/es) + Object','सवयी, सार्वत्रिक सत्य, नियमित कृती','I study English every day.','मी दररोज इंग्रजीचा अभ्यास करतो.'],
['Present Continuous','Subject + am/is/are + V-ing','आत्ता चालू असलेली कृती','She is reading a book.','ती पुस्तक वाचत आहे.'],
['Present Perfect','Subject + has/have + V3','नुकतीच पूर्ण झालेली किंवा वर्तमानाशी संबंध असलेली कृती','They have finished the work.','त्यांनी काम पूर्ण केले आहे.'],
['Present Perfect Continuous','Subject + has/have been + V-ing + since/for','भूतकाळापासून आतापर्यंत सुरू असलेली कृती','He has been studying for two hours.','तो दोन तासांपासून अभ्यास करत आहे.'],
['Past Simple','Subject + V2 + Object','भूतकाळातील पूर्ण कृती','We visited Pune yesterday.','आम्ही काल पुण्याला भेट दिली.'],
['Past Continuous','Subject + was/were + V-ing','भूतकाळातील विशिष्ट वेळी चालू कृती','I was reading at 8 pm.','मी रात्री 8 वाजता वाचत होतो.'],
['Past Perfect','Subject + had + V3','भूतकाळातील दुसऱ्या कृतीपूर्वी पूर्ण झालेली कृती','She had left before I arrived.','मी पोहोचण्यापूर्वी ती निघून गेली होती.'],
['Past Perfect Continuous','Subject + had been + V-ing + since/for','भूतकाळातील एका वेळेपर्यंत काही काळ सुरू असलेली कृती','He had been working for three hours.','तो तीन तासांपासून काम करत होता.'],
['Future Simple','Subject + will + V1','भविष्यातील कृती, निर्णय किंवा अंदाज','I will help you.','मी तुला मदत करीन.'],
['Future Continuous','Subject + will be + V-ing','भविष्यातील विशिष्ट वेळी चालू असलेली कृती','They will be travelling tomorrow.','ते उद्या प्रवास करत असतील.'],
['Future Perfect','Subject + will have + V3','भविष्यातील ठरावीक वेळेपूर्वी पूर्ण झालेली कृती','She will have finished the work by Monday.','सोमवारपर्यंत तिने काम पूर्ण केलेले असेल.'],
['Future Perfect Continuous','Subject + will have been + V-ing + since/for','भविष्यातील एका वेळेपर्यंत काही काळ सुरू असलेली कृती','By June, I will have been working here for five years.','जूनपर्यंत मला येथे काम करत पाच वर्षे पूर्ण झालेली असतील.']];
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function speak(text,lang='en-IN'){if(!('speechSynthesis'in window)){alert('या browser मध्ये Audio सुविधा उपलब्ध नाही.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.88;speechSynthesis.speak(u)}
function speakCurrent(){let t=document.getElementById('lesson').innerText;speak(t,'en-IN')}
function renderTopics(){let q=document.getElementById('search').value.toLowerCase();let box=document.getElementById('topics');box.innerHTML='';topics.forEach((t,i)=>{if((t[0]+' '+t[1]).toLowerCase().includes(q)){let b=document.createElement('button');b.className='topic';b.textContent=(i+1)+'. '+t[0]+' — '+t[1];b.onclick=()=>loadTopic(i);box.appendChild(b)}})}
function filterTopics(){renderTopics()}
function loadTopic(i){document.querySelectorAll('.topic').forEach(x=>x.classList.remove('active'));let buttons=[...document.querySelectorAll('.topic')];buttons.forEach(b=>{if(b.textContent.startsWith((i+1)+'.'))b.classList.add('active')});if(i===12)return renderTenses();let [en,mr]=topics[i];let data={
'Direct and Indirect Speech':['Direct Speech मध्ये वक्त्याचे मूळ शब्द quotation marks मध्ये दिले जातात. Indirect Speech मध्ये ते अर्थ कायम ठेवून बदललेल्या रचनेत सांगितले जातात.','Direct: He said, “I am tired.” → Indirect: He said that he was tired.','Pronoun, tense, time words आणि reporting verb यांतील बदल काळजीपूर्वक तपासा.'],
'Articles':['Article म्हणजे noun च्या आधी वापरला जाणारा शब्द. a/an सामान्यतः singular countable noun साठी आणि the विशिष्ट noun साठी वापरले जाते.','a book, an apple, the sun','Article निवडताना spelling पेक्षा pronunciation महत्त्वाचे आहे: an hour, a university.'],
'Translation':['एका भाषेतील अर्थ दुसऱ्या भाषेत नैसर्गिक आणि अचूक पद्धतीने मांडणे म्हणजे Translation.','He works hard. → तो मेहनत करतो.','शब्दशः भाषांतर करण्याऐवजी अर्थ, tense आणि sentence structure तपासा.']};let d=data[en]||['या Topic मध्ये परीक्षेच्या दृष्टीने मूलभूत संकल्पना, नियम, उदाहरणे आणि सराव यांचा अभ्यास केला जाईल.','English example: Practice makes a person perfect.','मराठी अर्थ: सरावाने माणूस परिपूर्ण होतो.'];document.getElementById('lesson').innerHTML=lessonHTML(i,en,mr,d[0],d[1],d[2])}
function lessonHTML(i,en,mr,def,ex,tip){let q=['Which option is most appropriate for '+en+'?','Choose the correct English sentence.','Which statement is correct?'];return `<h1>${i+1}. ${en} <span class="mr">(${mr})</span></h1><div class="box"><b>व्याख्या / Definition:</b><br>${def}<br><span class="mr">मराठी: हा घटक इंग्रजी भाषेची रचना, अचूक वापर आणि परीक्षेतील प्रश्न सोडवण्यासाठी महत्त्वाचा आहे.</span></div><h2>रचना / Structure</h2><div class="formula">Subject + Verb + Object / Complement</div><h2>नियम / Rules</h2><ol><li>वाक्याचा अर्थ आणि grammatical role ओळखा.</li><li>Tense आणि subject-verb agreement तपासा.</li><li>Exam मध्ये पर्यायांतील सूक्ष्म फरक काळजीपूर्वक पाहा.</li></ol><h2>5 उदाहरणे / Examples</h2>${['I read English every day.','She writes a letter.','They are ready for the exam.','We completed the lesson.','Practice improves accuracy.'].map((x,j)=>`<div class="example"><span class="en">${x}</span><br><span class="mr">मराठी: ${['मी दररोज इंग्रजी वाचतो.','ती पत्र लिहिते.','ते परीक्षेसाठी तयार आहेत.','आम्ही धडा पूर्ण केला.','सरावामुळे अचूकता सुधारते.'][j]}</span><br><button class="btn" onclick="speak('${x.replace(/'/g,"\\'")}')">🔊 ऐका</button></div>`).join('')}<h2>उदाहरणाचे विश्लेषण</h2><div class="box"><b>${ex}</b><br>${tip}</div><h2>Common Mistakes</h2><div class="mistake">Subject आणि verb यांचा मेळ, article, preposition आणि tense यांमध्ये चुका होऊ शकतात. उत्तर देण्यापूर्वी पूर्ण sentence पुन्हा वाचा.</div><h2>Exam Points</h2><div class="exam">Definition + Rule + Example हा क्रम लक्षात ठेवा. पर्याय वाचताना grammatical clue शोधा.</div><h2>10 MCQ Practice</h2>${Array.from({length:10},(_,n)=>mcq(n,i)).join('')}<div class="ai"><h2>🤖 AI Assistance</h2><p>तुमचा प्रश्न लिहा. ही आवृत्ती सुरक्षित offline study assistant म्हणून मार्गदर्शक उत्तर देते. पुढील आवृत्तीत सुरक्षित AI API जोडता येईल.</p><textarea id="aiq" placeholder="उदा. Present Perfect आणि Past Simple मधील फरक सांगा."></textarea><button class="btn gold" onclick="askAI()">AI शिक्षकाला विचारा</button><div id="aiout" class="aiout"></div></div>`}
function mcq(n,i){let opts=['A. Correct grammatical structure','B. Incorrect structure','C. Only a noun','D. Only a punctuation mark'];return `<div class="mcq"><b>${n+1}. ${topics[i][0]} संदर्भात योग्य विधान कोणते?</b>${opts.map((o,j)=>`<button onclick="answer(this,${j===0})">${o}</button>`).join('')}<div class="small" id="a${i}-${n}"></div></div>`}
function answer(btn,ok){let p=btn.parentElement;p.querySelectorAll('button').forEach(b=>b.disabled=true);btn.classList.add(ok?'correct':'wrong');let s=document.createElement('div');s.className='small';s.textContent=ok?'✓ बरोबर!':'✗ पुन्हा नियम तपासा.';p.appendChild(s);if(ok)saveProgress()}
function renderTenses(){let cards=tenseData.map((t,i)=>`<div class="example"><h3>${i+1}. ${t[0]}</h3><div class="formula">${t[1]}</div><b>वापर:</b> ${t[2]}<br><span class="en">${t[3]}</span><br><span class="mr">मराठी: ${t[4]}</span><br><button class="btn" onclick="speak('${(t[3]+' '+t[4]).replace(/'/g,"\\'")}')">🔊 ऐका</button></div>`).join('');document.getElementById('lesson').innerHTML=`<h1>13. Tenses — काळाचे 12 प्रकार</h1><div class="box"><b>मुख्य विभाग:</b> Present, Past आणि Future. प्रत्येक विभागात Simple, Continuous, Perfect आणि Perfect Continuous असे 4 प्रकार आहेत.</div><h2>12 Tenses — स्वतंत्र अभ्यास</h2>${cards}<h2>Exam Tip</h2><div class="exam">V1, V2, V3 आणि V-ing यांचा योग्य वापर ओळखा. since/for, yesterday, now, already, by, tomorrow यांसारखे संकेत शब्द प्रश्न सोडवताना मदत करतात.</div><div class="ai"><h2>🤖 AI Assistance</h2><textarea id="aiq" placeholder="उदा. Present Perfect चे 5 उदाहरणे द्या."></textarea><button class="btn gold" onclick="askAI()">AI शिक्षकाला विचारा</button><div id="aiout" class="aiout"></div></div>`}
function askAI(){let q=(document.getElementById('aiq')||{}).value||'';let out=document.getElementById('aiout');if(!q.trim()){out.textContent='कृपया प्रश्न लिहा.';return}let low=q.toLowerCase();if(low.includes('present perfect'))out.textContent='Present Perfect: Subject + has/have + V3. उदाहरण: I have completed my work. मराठी: मी माझे काम पूर्ण केले आहे. या काळाचा वापर वर्तमानाशी संबंध असलेल्या पूर्ण कृतीसाठी होतो.';else if(low.includes('past simple'))out.textContent='Past Simple: Subject + V2. उदाहरण: I visited Pune yesterday. मराठी: मी काल पुण्याला भेट दिली. भूतकाळातील पूर्ण कृतीसाठी वापर.';else out.textContent='अभ्यासासाठी हा प्रश्न संबंधित Topic मध्ये तपासा. AI Assistance च्या पुढील सुरक्षित online आवृत्तीत तुम्ही मुक्तपणे प्रश्न विचारू शकाल.'}
function saveProgress(){let n=+localStorage.getItem('ndEnglishProgress')||0;n=Math.min(100,n+1);localStorage.setItem('ndEnglishProgress',n);updateProgress()}function updateProgress(){let n=+localStorage.getItem('ndEnglishProgress')||0;document.getElementById('pct').textContent=n+'%';document.getElementById('prog').style.width=n+'%'}
renderTopics();updateProgress();loadTopic(0);
</script></body></html>
