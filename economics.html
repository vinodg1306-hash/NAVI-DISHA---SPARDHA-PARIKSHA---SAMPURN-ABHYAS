<title>भारतीय अर्थव्यवस्था — संपूर्ण संदर्भ ग्रंथ | नवी दिशा</title>
  <link rel="stylesheet" href="style.css">

<style>
:root{--nav:#5c2d00;--nav2:#b35900;--bg:#fffbf7;--card:#fff;--text:#2b1803;--muted:#6e5640;--accent:#ffbe1a;--ok:#128c5a;--bad:#d63031;--line:#eddcd0;--shadow:0 8px 24px rgba(92,45,0,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Devanagari",Arial,sans-serif;line-height:1.65}
.top{background:linear-gradient(135deg,var(--nav),var(--nav2));color:#fff;padding:24px 18px}
.wrap{max-width:1180px;margin:auto}
.brand{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px}
.tag{opacity:.92;font-size:14px;margin-top:4px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:10px;padding:9px 15px;font-weight:700;cursor:pointer;background:#fff;color:var(--nav);transition:.2s}
.btn:hover{opacity:.9}.btn.gold{background:var(--accent);color:#2b1803}.btn.dark{background:#361a00;color:#fff}
.cat-nav{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.cat-btn{background:#faeedf;color:var(--nav);border:0;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer;white-space:nowrap}
.cat-btn.active{background:var(--nav2);color:#fff}
.grid{display:grid;grid-template-columns:320px 1fr;gap:20px;padding:20px 0}
.panel,.lesson{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.panel{padding:14px;height:max-content;position:sticky;top:12px}
.panel h3{margin:5px 8px 10px;font-size:17px;color:var(--nav)}
.progress-box{background:#fdf2e4;padding:10px 12px;border-radius:10px;margin-bottom:12px;border:1px solid #f9d8b3}
.progress-bar-bg{background:#e8d1bc;height:9px;border-radius:5px;overflow:hidden;margin-top:6px}
.progress-bar-fill{background:var(--ok);height:100%;width:0%;transition:.3s}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.topics{max-height:65vh;overflow-y:auto}
.topic{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--text);font-weight:600;font-size:14px;border-bottom:1px solid #fdf0e2}
.topic:hover,.topic.active{background:#fae5ce;color:var(--nav);font-weight:700}
.topic.done::after{content:"✓";color:var(--ok);font-weight:bold;margin-left:6px}
.lesson{padding:25px}
.lesson h1{margin-top:0;color:var(--nav);font-size:24px}
.lesson h2{color:var(--nav);border-bottom:2px solid #faeedf;padding-bottom:6px;margin-top:22px;font-size:19px}
.lesson h3{color:var(--nav2);margin-top:16px;font-size:16px}
.box{background:#fef9f4;border-left:5px solid var(--nav2);padding:14px 16px;border-radius:8px;margin:12px 0}
.exam-fact{background:#eef9f2;border-left:5px solid var(--ok);padding:12px 14px;border-radius:8px;margin:12px 0}
.mcq-card{border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0;background:#fffdfa}
.mcq-card b{display:block;margin-bottom:8px}
.opt-btn{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border:1px solid #ebd3c0;background:#fff;border-radius:8px;cursor:pointer;font-size:14px}
.opt-btn.correct{background:#e8f8f0;border-color:var(--ok);color:var(--ok);font-weight:bold}
.opt-btn.wrong{background:#ffebee;border-color:var(--bad);color:var(--bad)}
.exp{display:none;margin-top:8px;padding:8px 10px;background:#fef5ec;border-radius:6px;font-size:13px;color:var(--text)}
.complete-btn{margin-top:20px;padding:10px 18px;border-radius:8px;border:0;background:var(--ok);color:#fff;font-weight:bold;cursor:pointer}
.foot{text-align:center;color:var(--muted);padding:25px;font-size:14px}
@media print {
  .top,.panel,.cat-nav,.bar,.foot,.complete-btn{display:none!important}
  .grid{display:block!important;padding:0!important}
  .lesson{border:none!important;box-shadow:none!important;padding:0!important}
}
@media(max-width:850px){.grid{grid-template-columns:1fr}.panel{position:static}.topics{max-height:280px}.lesson{padding:18px}}
</style>
</head>

    <div id="topicList" class="topics"></div>

      <h3>१. भारतीय कररचना (Taxes in India)</h3>

        • <b>प्रत्यक्ष कर (Direct Tax):</b> ज्या व्यक्तीवर कर लादला जातो, तोच तो भरतो (कराचा भार हस्तांतरित करता येत नाही). उदा. <b>आयकर (Income Tax), कॉर्पोरेट कर (कंपनी कर), भांडवली नफा कर</b>.<br>

let currentCat = 'all';
let completedTopics = JSON.parse(localStorage.getItem('navi_economics_book10') || '[]');

function updateProgressUI() {
  const count = completedTopics.length;
  document.getElementById('progText').innerText = count + ' / 10';
  const pct = Math.round((count / 10) * 100);
  document.getElementById('progBar').style.width = pct + '%';
}

function toggleComplete(id) {
  if (completedTopics.includes(id)) {
    completedTopics = completedTopics.filter(x => x !== id);
  } else {
    completedTopics.push(id);
  }
  localStorage.setItem('navi_economics_book10', JSON.stringify(completedTopics));
  updateProgressUI();
  filterCat(currentCat);
  loadLesson(id);
}

function renderList(filteredTopics) {
  const container = document.getElementById('topicList');
  container.innerHTML = '';
  filteredTopics.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'topic' + (completedTopics.includes(t.id) ? ' done' : '');
    btn.id = 'top-' + t.id;
    btn.innerText = t.title;
    btn.onclick = () => loadLesson(t.id);
    container.appendChild(btn);
  });
}

function filterCat(cat, elem) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  if (elem) elem.classList.add('active');
  const filtered = cat === 'all' ? syllabus : syllabus.filter(t => t.cat === cat);
  renderList(filtered);
}

function searchTopics() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = syllabus.filter(t => {
    const matchesCat = (currentCat === 'all' || t.cat === currentCat);
    return matchesCat && (t.title.toLowerCase().includes(q) || (t.id + '').includes(q));
  });
  renderList(filtered);
}

function loadLesson(id) {
  document.querySelectorAll('.topic').forEach(b => b.classList.remove('active'));
  const activeBtn = document.getElementById('top-' + id);
  if (activeBtn) activeBtn.classList.add('active');

  const container = document.getElementById('lessonContainer');
  const data = lessonsContent[id];
  const isDone = completedTopics.includes(id);

  if (!data) return;

  let mcqHTML = '<h2>📝 सराव प्रश्नसंच (१० परीक्षाभिमुख MCQs)</h2>';
  data.mcqs.forEach((m, idx) => {
    mcqHTML += `
      <div class="mcq-card">
        <b>प्र. ${idx + 1}) ${m.q}</b>
        ${m.options.map((opt, oIdx) => `
          <button class="opt-btn" onclick="checkAnswer(this, ${oIdx === m.ans}, ${idx}, '${encodeURIComponent(m.exp)}')">
            ${String.fromCharCode(65 + oIdx)}. ${opt}
          </button>
        `).join('')}
        <div class="exp" id="exp-${idx}"></div>
      </div>
    `;
  });

  container.innerHTML = `
    <h1>${data.title}</h1>
    ${data.content}
    ${mcqHTML}
    <hr style="margin-top:25px;border:0;border-top:1px solid var(--line)">
    <button class="complete-btn" onclick="toggleComplete(${id})">
      ${isDone ? '✓ पूर्ण झाले म्हणून नोंदवले आहे (रद्द करा)' : '☑ हे प्रकरण पूर्ण झाले म्हणून नोंदवा'}
    </button>
  `;
}

function checkAnswer(btn, isCorrect, qIdx, expEncoded) {
  const parent = btn.parentElement;
  parent.querySelectorAll('.opt-btn').forEach(b => {
    b.classList.remove('correct', 'wrong');
  });

  const expBox = document.getElementById('exp-' + qIdx);
  expBox.style.display = 'block';
  expBox.innerHTML = '<b>स्पष्टीकरण:</b> ' + decodeURIComponent(expEncoded);

  if (isCorrect) {
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
  }
}

function speakCurrent() {
  const text = document.getElementById('lessonContainer').innerText;
  if (!('speechSynthesis' in window)) {
    alert('आपल्या ब्राउझरमध्ये ऑडिओ सुविधा उपलब्ध नाही.');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'mr-IN';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

// ॲप सुरू करणे
updateProgressUI();
filterCat('all');
loadLesson(1);
</script>
